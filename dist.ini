name    = Authen-WebAuthn
author  = Maxime Besson <mbesson@cpan.org>
license = Perl_5
copyright_holder = Maxime Besson
copyright_year   = 2024

version = 0.005
abstract = A library to add Web Authentication support to server applications


[@Basic]
[@Git]

[AutoPrereqs]
[OurPkgVersion]
[GithubMeta]
issues=1

[PodWeaver]
finder=pods
[FileFinder::ByName / pods]
file  = *.pod

[PodSyntaxTests]
[PodCoverageTests]
[Test::Perl::Critic]
[Test::MinimumVersion]
max_target_perl = 5.010

[Prereqs]
perl = 5.010

; JSON.pm uses JSON::XS when it is installed, and is several times slower
; without it
[Prereqs / RuntimeRecommends]
JSON::XS = 0
