name: test

on:
  push:
  pull_request:

jobs:
  test:
    name: Perl ${{ matrix.perl }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl: ["5.20", "5.26", "5.32", "5.40"]
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Install dependencies
        run: >-
          cpanm --notest CBOR::XS Crypt::OpenSSL::X509 Crypt::URandom CryptX
          Hash::Merge::Simple JSON Mouse Net::SSLeay URI
          || { cat ~/.cpanm/build.log; exit 1; }
      - run: prove -l t

  valgrind:
    name: valgrind
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"
      - name: Install dependencies
        run: >-
          cpanm --notest CBOR::XS Crypt::OpenSSL::X509 Crypt::URandom CryptX
          Hash::Merge::Simple JSON Mouse Net::SSLeay URI
          || { cat ~/.cpanm/build.log; exit 1; }
      - run: prove -lv xt/valgrind.t

  dist:
    name: dzil build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: "5.40"
          install-modules-with: cpanm
          install-modules-args: --notest
          install-modules: Dist::Zilla
      - run: dzil authordeps --missing | cpanm --notest
      - run: dzil listdeps --missing | cpanm --notest
      - run: dzil build
      - run: dzil test
